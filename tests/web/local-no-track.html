<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Video without any subtitle track</title>
    <style>
      body { background: #1a1024; color: #e9d5ff; font: 14px/1.6 system-ui, sans-serif; margin: 0; padding: 24px; }
      video { width: 480px; max-width: 100%; background: #000; border-radius: 8px; }
    </style>
  </head>
  <body>
    <h1>Page with a video but no subtitles at all</h1>
    <p>Used by the playtest to prove that a failing/unavailable adapter never breaks the extension (spec §11).</p>
    <video id="v" width="480" controls preload="auto" muted><source src="sample.webm" type="video/webm" /></video>
  </body>
</html>
